<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Catálogo de Maquillaje</title>
    <style>
        /* ==========================================================
           1. PALETA Y TIPOGRAFÍAS DEL MANUAL DE MARCA
           El rosado (--color-rosa) es ahora el color protagonista.
           El verde queda como acento secundario (precios, detalles)
           y el oliva como línea/borde muy puntual.
           ========================================================== */
        :root {
            --color-rosa: #cf8683;
            --color-rosa-oscuro: #b56663;
            --color-rosa-suave: #f3d9d8;
            --color-verde: #1e9185;
            --color-fondo: #eaeaea;
            --color-oliva: #dad9a8;
            --texto-oscuro: #2b2b2b;
            --blanco: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            /* Usa Gilroy si está instalada, si no, una sans-serif limpia */
            font-family: 'Gilroy', 'Gilroy-UltraLight', -apple-system, sans-serif;
            background-color: #f7f1f0; /* fondo con tinte rosado muy suave */
            color: var(--texto-oscuro);
            margin: 0;
            padding: 0;
            padding-bottom: 40px;
        }

        h1, h2, h3 {
            /* Usa CoFo Raffine para títulos */
            font-family: 'CoFo Raffine', Georgia, serif;
            font-weight: normal;
        }

        a { text-decoration: none; }

        /* ==========================================================
           2. BARRA SUPERIOR — logo + botones a Instagram y WhatsApp
           ========================================================== */
        .barra-superior {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--blanco);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .marca-wordmark {
            font-family: 'CoFo Raffine', Georgia, serif;
            font-size: 1.2em;
            color: var(--color-rosa-oscuro);
            letter-spacing: 0.5px;
        }

        .botones-contacto { display: flex; gap: 10px; }

        .btn-contacto {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.25s;
        }
        .btn-contacto svg { width: 20px; height: 20px; }

        .btn-contacto.ig {
            background: linear-gradient(135deg, var(--color-rosa), var(--color-rosa-oscuro));
        }
        .btn-contacto.wsp { background-color: #25D366; }
        .btn-contacto:active { transform: scale(0.92); }

        /* ==========================================================
           3. VISTA INICIO — hero + 6 recuadros de categorías
           ========================================================== */
        .contenido { max-width: 900px; margin: 0 auto; padding: 0 18px; }

        .hero { text-align: center; padding: 34px 18px 10px; }
        .hero h1 { font-size: 2.3em; color: var(--color-rosa-oscuro); margin: 0 0 6px; }
        .hero p.subtitulo {
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.78em;
            color: #8a8a8a;
        }

        .grid-categorias {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin: 26px auto 10px;
        }

        .tile-categoria {
            position: relative;
            aspect-ratio: 1 / 1.05;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            background-color: var(--color-fondo);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        .tile-fondos { position: absolute; inset: 0; }
        .tile-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.1s ease-in-out;
        }
        .tile-img.activa { opacity: 1; }

        .tile-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(90,30,35,0.72) 100%);
        }

        .tile-nombre {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 12px;
            color: var(--blanco);
            font-family: 'CoFo Raffine', Georgia, serif;
            font-size: 1.15em;
            text-shadow: 0 2px 6px rgba(0,0,0,0.35);
        }

        .tile-contador {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 3px;
        }
        .tile-punto {
            width: 5px; height: 5px; border-radius: 50%;
            background: rgba(255,255,255,0.45);
            transition: 0.3s;
        }
        .tile-punto.activo { background: var(--blanco); width: 12px; border-radius: 3px; }

        .tile-vacia {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 0.75em;
            color: #b3aeae;
            text-align: center;
            padding: 10px;
        }

        /* ==========================================================
           4. VISTA CATEGORÍA — productos de una sola categoría
           ========================================================== */
        .barra-categoria {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 22px 0 6px;
        }
        .btn-volver {
            background: var(--blanco);
            border: 1px solid #eee;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 0.9em;
            cursor: pointer;
            color: var(--texto-oscuro);
        }
        #titulo-categoria { margin: 0; color: var(--color-rosa-oscuro); font-size: 1.6em; }

        .mensaje-vacio {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 0.95em;
        }

        /* ==========================================================
           5. GRILLA DE PRODUCTOS (dentro de una categoría)
           ========================================================== */
        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin: 10px auto 30px;
        }

        .tarjeta {
            background: var(--blanco);
            border-radius: 15px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-bottom: 4px solid var(--color-rosa);
        }

        .tarjeta img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
            background-color: var(--color-fondo);
        }

        .tarjeta h3 { margin: 10px 0 4px; font-size: 1.05em; }
        .precio { font-weight: bold; color: var(--color-verde); font-size: 1.05em; margin-bottom: 12px; }

        button.btn-agregar {
            background-color: var(--color-rosa);
            color: white;
            border: none;
            padding: 11px 14px;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            font-size: 0.95em;
            font-family: inherit;
            transition: 0.25s;
        }
        button.btn-agregar:hover,
        button.btn-agregar:active { background-color: var(--color-rosa-oscuro); }

        /* ==========================================================
           6. CARRITO
           ========================================================== */
        #carrito {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: white;
            padding: 18px 20px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            border-radius: 25px 25px 0 0;
            display: none;
            max-width: 900px;
            margin: 0 auto;
            border-top: 5px solid var(--color-oliva);
            max-height: 75vh;
            overflow-y: auto;
        }

        #lista-carrito { list-style: none; padding: 0; margin: 0 0 15px 0; max-height: 200px; overflow-y: auto; }

        .item-carrito {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            gap: 8px;
        }

        .item-info { flex: 2; text-align: left; }
        .item-info strong { font-family: 'CoFo Raffine', Georgia, serif; font-size: 1.05em; }

        .controles-cantidad { display: flex; align-items: center; gap: 8px; }
        .btn-control {
            background-color: var(--color-fondo);
            border: none;
            width: 28px; height: 28px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: var(--texto-oscuro);
        }
        .btn-control:hover { background-color: var(--color-rosa-suave); }
        .btn-eliminar { background: transparent; border: none; cursor: pointer; font-size: 1.15em; margin-left: 6px; }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 25px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        /* Tablet / escritorio: un poco más de aire, 3 columnas en categorías */
        @media (min-width: 640px) {
            .grid-categorias { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <!-- ============ BARRA SUPERIOR ============ -->
    <header class="barra-superior">
        <span class="marca-wordmark">Armonía Make-up</span>
        <div class="botones-contacto">
            <a class="btn-contacto ig" id="link-instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram" title="Síguenos en Instagram">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
                    <rect x="3" y="3" width="18" height="18" rx="5"/>
                    <circle cx="12" cy="12" r="4.2"/>
                    <circle cx="17.2" cy="6.8" r="0.9" fill="white" stroke="none"/>
                </svg>
            </a>
            <a class="btn-contacto wsp" id="link-whatsapp-asesoria" href="#" target="_blank" rel="noopener" aria-label="WhatsApp" title="Escríbenos por WhatsApp">
                <svg viewBox="0 0 24 24" fill="white">
                    <path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1-.7-.3-1.5-.8-2.1-1.5-.5-.6-.9-1.2-1-1.4-.1-.2 0-.4.1-.5l.4-.5c.1-.1.2-.3.2-.4.1-.2 0-.3 0-.4l-.6-1.5c-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.4c.1.2 1.6 2.5 3.9 3.4.5.2 1 .4 1.3.5.5.2 1 .1 1.4.1.4-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/>
                </svg>
            </a>
        </div>
    </header>

    <div class="contenido">

        <!-- ============ VISTA: INICIO (6 categorías) ============ -->
        <main id="vista-inicio">
            <div class="hero">
                <h1>Armonía Make-up</h1>
                <p class="subtitulo">Elige una categoría para ver nuestros productos</p>
            </div>
            <div class="grid-categorias" id="grid-categorias"><!-- generado por JS --></div>
        </main>

        <!-- ============ VISTA: CATEGORÍA (productos filtrados) ============ -->
        <main id="vista-categoria" style="display:none;">
            <div class="barra-categoria">
                <button class="btn-volver" onclick="volverInicio()">← Categorías</button>
                <h2 id="titulo-categoria"></h2>
            </div>
            <div class="productos" id="grid-productos"><!-- generado por JS --></div>
        </main>

    </div>

    <!-- ============ CARRITO ============ -->
    <div id="carrito">
        <h2 style="margin-top: 0; margin-bottom: 10px; color: var(--color-verde);">Tu Pedido</h2>
        <ul id="lista-carrito"></ul>
        <h2 style="text-align: right; margin: 10px 0;">Total: $<span id="total">0</span></h2>
        <button class="btn-whatsapp" onclick="enviarWhatsApp()">Enviar pedido por WhatsApp 📲</button>
    </div>

    <script>
        // ==========================================================
        // 1. CONFIGURACIÓN GENERAL — edita estos datos con los tuyos
        // ==========================================================
        const INSTAGRAM_URL = "https://instagram.com/tu_usuario";          // tu perfil de Instagram
        const WHATSAPP_ASESORIA = "573000000000";                          // número para asesorías (sin +, sin espacios)
        const MENSAJE_ASESORIA = "¡Hola! 👋 Quisiera una asesoría de maquillaje.";
        const WHATSAPP_PEDIDOS = "573000000000";                           // número donde llegan los pedidos del carrito

        document.getElementById('link-instagram').href = INSTAGRAM_URL;
        document.getElementById('link-whatsapp-asesoria').href =
            `https://wa.me/${WHATSAPP_ASESORIA}?text=${encodeURIComponent(MENSAJE_ASESORIA)}`;

        // ==========================================================
        // 2. CATEGORÍAS — agrega, elimina o renombra aquí (deja los 6
        //    o cambia la cantidad; la grilla se acomoda sola)
        // ==========================================================
        const categorias = [
            { id: 'labios',      nombre: 'Labios' },
            { id: 'rostro',      nombre: 'Rostro' },
            { id: 'ojos',        nombre: 'Ojos' },
            { id: 'rubor',       nombre: 'Rubor y Mejillas' },
            { id: 'cejas',       nombre: 'Cejas' },
            { id: 'accesorios',  nombre: 'Accesorios y Brochas' }
        ];

        // ==========================================================
        // 3. PRODUCTOS — AQUÍ AGREGAS CADA PRODUCTO NUEVO
        //    - nombre:    texto que ve el cliente
        //    - precio:    número, sin puntos ni signo $
        //    - categoria: debe coincidir con un "id" de la lista de arriba
        //    - imagen:    URL de la foto del producto
        //    Reemplaza las URLs de ejemplo por las fotos reales de tus
        //    productos. Si una categoría tiene 2 o más productos, el
        //    recuadro de esa categoría en el inicio irá alternando sus
        //    fotos automáticamente, como un mini carrusel.
        // ==========================================================
        const productos = [
            { nombre: 'Labial Tono Nude',        precio: 45000, categoria: 'labios',     imagen: 'imagenes/Labios/(A) Lip Gloss Anik.jpg' },
            { nombre: 'Labial Tono Rojo',         precio: 45000, categoria: 'labios',     imagen: 'https://via.placeholder.com/400x400/cf8683/ffffff?text=Labial+Rojo' },

            { nombre: 'Base Líquida (Tono 2)',    precio: 80000, categoria: 'rostro',     imagen: 'https://via.placeholder.com/400x400/eaeaea/2b2b2b?text=Base+Liquida' },
            { nombre: 'Polvo Compacto',           precio: 60000, categoria: 'rostro',     imagen: 'https://via.placeholder.com/400x400/dad9a8/2b2b2b?text=Polvo' },

            { nombre: 'Paleta de Sombras',        precio: 70000, categoria: 'ojos',       imagen: 'https://via.placeholder.com/400x400/cf8683/ffffff?text=Sombras' },
            { nombre: 'Máscara de Pestañas',      precio: 38000, categoria: 'ojos',       imagen: 'https://via.placeholder.com/400x400/2b2b2b/ffffff?text=Mascara' },

            { nombre: 'Rubor Melocotón',          precio: 35000, categoria: 'rubor',      imagen: 'https://via.placeholder.com/400x400/f3d9d8/2b2b2b?text=Rubor' },
            { nombre: 'Iluminador en Polvo',      precio: 42000, categoria: 'rubor',      imagen: 'https://via.placeholder.com/400x400/eaeaea/2b2b2b?text=Iluminador' },

            { nombre: 'Gel para Cejas',           precio: 28000, categoria: 'cejas',      imagen: 'https://via.placeholder.com/400x400/1e9185/ffffff?text=Gel+Cejas' },
            { nombre: 'Lápiz de Cejas',           precio: 25000, categoria: 'cejas',      imagen: 'https://via.placeholder.com/400x400/dad9a8/2b2b2b?text=Lapiz+Cejas' },

            { nombre: 'Set de Brochas (5 pzs)',   precio: 90000, categoria: 'accesorios', imagen: 'https://via.placeholder.com/400x400/cf8683/ffffff?text=Brochas' },
            { nombre: 'Esponja Beauty Blender',   precio: 22000, categoria: 'accesorios', imagen: 'https://via.placeholder.com/400x400/eaeaea/2b2b2b?text=Esponja' }
        ];

        // ==========================================================
        // 4. RENDER DE LOS 6 RECUADROS DE CATEGORÍA (vista de inicio)
        // ==========================================================
        const INTERVALO_CARRUSEL = 2400; // milisegundos entre cada cambio de foto

        function crearGridCategorias() {
            const grid = document.getElementById('grid-categorias');
            grid.innerHTML = '';

            categorias.forEach(cat => {
                const imagenesCat = productos.filter(p => p.categoria === cat.id).map(p => p.imagen);

                const tile = document.createElement('div');
                tile.className = 'tile-categoria';
                tile.onclick = () => mostrarCategoria(cat.id);

                if (imagenesCat.length === 0) {
                    tile.innerHTML = `<div class="tile-vacia">${cat.nombre}<br><span style="font-size:0.8em;">(sin productos aún)</span></div>`;
                    grid.appendChild(tile);
                    return;
                }

                const imgsHTML = imagenesCat.map((src, i) =>
                    `<img class="tile-img ${i === 0 ? 'activa' : ''}" src="${src}" alt="${cat.nombre}">`
                ).join('');

                const puntosHTML = imagenesCat.length > 1
                    ? `<div class="tile-contador">${imagenesCat.map((_, i) => `<span class="tile-punto ${i === 0 ? 'activo' : ''}"></span>`).join('')}</div>`
                    : '';

                tile.innerHTML = `
                    <div class="tile-fondos">${imgsHTML}</div>
                    <div class="tile-overlay"></div>
                    ${puntosHTML}
                    <div class="tile-nombre">${cat.nombre}</div>
                `;
                grid.appendChild(tile);

                // Si hay más de una imagen, se van alternando en bucle (efecto "video")
                if (imagenesCat.length > 1) {
                    let indice = 0;
                    setInterval(() => {
                        const imgs = tile.querySelectorAll('.tile-img');
                        const puntos = tile.querySelectorAll('.tile-punto');
                        imgs[indice].classList.remove('activa');
                        puntos[indice].classList.remove('activo');
                        indice = (indice + 1) % imgs.length;
                        imgs[indice].classList.add('activa');
                        puntos[indice].classList.add('activo');
                    }, INTERVALO_CARRUSEL);
                }
            });
        }

        // ==========================================================
        // 5. NAVEGACIÓN ENTRE INICIO Y CATEGORÍA
        // ==========================================================
        function mostrarCategoria(catId) {
            const cat = categorias.find(c => c.id === catId);
            document.getElementById('vista-inicio').style.display = 'none';
            document.getElementById('vista-categoria').style.display = 'block';
            document.getElementById('titulo-categoria').innerText = cat.nombre;
            renderProductos(catId);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function volverInicio() {
            document.getElementById('vista-categoria').style.display = 'none';
            document.getElementById('vista-inicio').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderProductos(catId) {
            const grid = document.getElementById('grid-productos');
            const items = productos.filter(p => p.categoria === catId);

            const msgVacio = document.getElementById('msg-vacio');
            if (msgVacio) msgVacio.remove();

            if (items.length === 0) {
                grid.innerHTML = '';
                grid.insertAdjacentHTML('afterend', `<p class="mensaje-vacio" id="msg-vacio">Todavía no hay productos en esta categoría. ¡Vuelve pronto! 💕</p>`);
                return;
            }

            grid.innerHTML = items.map(p => `
                <div class="tarjeta">
                    <img src="${p.imagen}" alt="${p.nombre}">
                    <h3>${p.nombre}</h3>
                    <p class="precio">$${p.precio.toLocaleString('es-CO')}</p>
                    <button class="btn-agregar" onclick="addToCart('${p.nombre.replace(/'/g, "\\'")}', ${p.precio})">Añadir al carrito</button>
                </div>
            `).join('');
        }

        // ==========================================================
        // 6. CARRITO DE COMPRAS (misma lógica original)
        // ==========================================================
        let carrito = [];

        function addToCart(nombre, precio) {
            let producto = carrito.find(item => item.nombre === nombre);
            if (producto) {
                producto.cantidad++;
            } else {
                carrito.push({ nombre: nombre, precio: precio, cantidad: 1 });
            }
            actualizarCarrito();
        }

        function sumar(nombre) {
            let producto = carrito.find(item => item.nombre === nombre);
            if (producto) {
                producto.cantidad++;
                actualizarCarrito();
            }
        }

        function restar(nombre) {
            let producto = carrito.find(item => item.nombre === nombre);
            if (producto) {
                if (producto.cantidad > 1) {
                    producto.cantidad--;
                } else {
                    eliminar(nombre);
                    return;
                }
                actualizarCarrito();
            }
        }

        function eliminar(nombre) {
            carrito = carrito.filter(item => item.nombre !== nombre);
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const contenedorCarrito = document.getElementById('carrito');
            const lista = document.getElementById('lista-carrito');
            const totalElemento = document.getElementById('total');

            lista.innerHTML = '';
            let total = 0;

            if (carrito.length === 0) {
                contenedorCarrito.style.display = 'none';
                return;
            }

            contenedorCarrito.style.display = 'block';

            carrito.forEach((item) => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;

                lista.innerHTML += `
                    <li class="item-carrito">
                        <div class="item-info">
                            <strong>${item.nombre}</strong><br>
                            <span style="color: #666;">$${item.precio.toLocaleString('es-CO')} c/u</span>
                        </div>
                        <div class="controles-cantidad">
                            <button class="btn-control" onclick="restar('${item.nombre}')">-</button>
                            <span>${item.cantidad}</span>
                            <button class="btn-control" onclick="sumar('${item.nombre}')">+</button>
                            <button class="btn-eliminar" onclick="eliminar('${item.nombre}')" title="Eliminar">🗑️</button>
                        </div>
                    </li>
                `;
            });

            totalElemento.innerText = total.toLocaleString('es-CO');
        }

        function enviarWhatsApp() {
            if (carrito.length === 0) return;

            let mensaje = "¡Hola! 👋 Quiero realizar el siguiente pedido:\n\n";
            let totalPedido = 0;

            carrito.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                totalPedido += subtotal;
                mensaje += `▪️ ${item.cantidad}x ${item.nombre} ($${subtotal.toLocaleString('es-CO')})\n`;
            });

            mensaje += `\n*Total a pagar: $${totalPedido.toLocaleString('es-CO')}*`;

            let textoCodificado = encodeURIComponent(mensaje);
            let url = `https://wa.me/${WHATSAPP_PEDIDOS}?text=${textoCodificado}`;
            window.open(url, '_blank');
        }

        // ==========================================================
